# MiniPMS full stack: Nginx + API + MySQL
# Prerequisites: put artifacts in ./release/ (see ../deploy/pack-release.ps1)
#   release/minipms-server
#   release/web/          (frontend dist contents)
#
# Persistent data (bind mounts next to this compose file):
#   ./data/mysql    → MySQL datadir
#   ./data/uploads  → attachment files
# On WSL e.g. /home/leo/projects/compose/data/...
# Windows Explorer: \\wsl.localhost\Ubuntu\home\leo\projects\compose\data\...
#
# Usage:
#   mkdir -p data/mysql data/uploads
#   docker compose up -d --build
#
# First-time DB init (./initdb/01-schema.sql) only runs when ./data/mysql is empty.
# To re-import schema/seed: stop stack, delete ./data/mysql contents, then up again.

services:
  mysql:
    image: mysql:8
    container_name: minipms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: minipms
      MYSQL_DATABASE: minipms
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
      # Must be a real file (not a directory created by a bad bind).
      - ./initdb/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pminipms"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - minipms

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: minipms-api
    restart: unless-stopped
    environment:
      MINIPMS_CONFIG: /app/configs/config.yaml
    volumes:
      - ./config.yaml:/app/configs/config.yaml:ro
      - ./data/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - minipms

  nginx:
    image: nginx:alpine
    container_name: minipms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Mount under /mini-pms so nginx root can host other sites/files
      - ./release/web:/usr/share/nginx/html/mini-pms:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - minipms

networks:
  minipms:
    driver: bridge
