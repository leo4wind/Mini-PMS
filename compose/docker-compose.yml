# MiniPMS full stack: Nginx + API + MySQL
# Prerequisites: put artifacts in ./release/ (see ../deploy/pack-release.ps1)
#   release/minipms-server
#   release/web/          (frontend dist contents)
#
# Usage:
#   docker compose up -d --build
#
# First-time DB init (DDL + seed in ./initdb/01-schema.sql) only runs on an empty MySQL volume.
# To re-import schema/seed:
#   docker compose down -v && docker compose up -d --build

services:
  mysql:
    image: mysql:8
    container_name: minipms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: minipms
      MYSQL_DATABASE: minipms
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - minipms-mysql-data:/var/lib/mysql
      # Must be a real file. Relative ../schema.sql often becomes an empty dir under Docker Desktop/WSL.
      - ./initdb/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pminipms"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - minipms

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: minipms-api
    restart: unless-stopped
    environment:
      MINIPMS_CONFIG: /app/configs/config.yaml
    volumes:
      - ./config.yaml:/app/configs/config.yaml:ro
      - minipms-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - minipms

  nginx:
    image: nginx:alpine
    container_name: minipms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Mount under /mini-pms so nginx root can host other sites/files
      - ./release/web:/usr/share/nginx/html/mini-pms:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - minipms

volumes:
  minipms-mysql-data:
  minipms-uploads:

networks:
  minipms:
    driver: bridge
