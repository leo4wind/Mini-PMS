server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # Legacy/wrong absolute paths → keep app under /mini-pms
    location = /login {
        return 302 /mini-pms/login$is_args$args;
    }
    location = /dashboard {
        return 302 /mini-pms/dashboard$is_args$args;
    }

    # API under /mini-pms/api/ → backend /api/
    location /mini-pms/api/ {
        proxy_pass http://api:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /mini-pms/health {
        proxy_pass http://api:8088/health;
        proxy_set_header Host $host;
    }

    location = /mini-pms {
        return 301 /mini-pms/;
    }

    location /mini-pms/ {
        try_files $uri $uri/ /mini-pms/index.html;
    }
}
